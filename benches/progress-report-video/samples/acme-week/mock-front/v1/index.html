<!doctype html>
<!-- Mock "before" build of a fake dashboard. It exists only to demonstrate the before/after method:
     make-screens.sh commits it as the first revision of a throwaway repo, rebuilds it from that commit and captures it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports · Acme</title>
<style>
  body { margin: 0; font: 13px/1.4 Arial, Helvetica, sans-serif; color: #333; background: #fff; }
  header { display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 48px; background: #f0f0f0; border-bottom: 1px solid #d0d0d0; }
  header b { font-size: 16px; }
  header a { color: #555; text-decoration: none; }
  header a.on { color: #000; font-weight: bold; }
  main { padding: 18px 20px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: #777; margin-bottom: 14px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  select, button { font: inherit; padding: 4px 8px; border: 1px solid #bbb; background: #f7f7f7; border-radius: 2px; }
  .grow { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
  th { background: #f4f4f4; font-weight: bold; }
  td.n { text-align: right; }
  tfoot td { font-weight: bold; background: #fafafa; }
  .up { color: #2a7a2a; } .down { color: #a33; }
  h2 { font-size: 14px; margin: 22px 0 8px; }
  .chart { display: flex; align-items: flex-end; gap: 10px; height: 220px; border: 1px solid #ddd; padding: 10px; }
  .chart div { flex: 1; background: #9aa5b1; position: relative; }
  .chart span { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; color: #777; font-size: 11px; }
  .empty { color: #999; padding: 24px; text-align: center; }
</style>
</head>
<body>
<header><b>Acme</b><a href="#">Overview</a><a class="on" href="#">Reports</a><a href="#">Settings</a></header>
<main>
  <h1>Reports</h1>
  <div class="sub">Workspace activity</div>
  <div class="bar">
    <select><option>Last 7 days</option></select>
    <span class="grow"></span>
    <button>Export CSV</button>
  </div>
  <table>
    <thead><tr><th>Team</th><th>Active members</th><th>Sessions</th><th>Reports viewed</th><th>Change</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
    <tfoot id="foot"></tfoot>
  </table>
  <h2>Sessions per day</h2>
  <div class="chart" id="chart"></div>
  <h2 style="margin-top:34px">Recent reports</h2>
  <table><thead><tr><th>Report</th><th>Date</th><th>Format</th><th>Type</th><th></th></tr></thead><tbody id="recent"></tbody></table>
</main>
<script>
  const fmt = (n) => n.toLocaleString('en-US')
  fetch('/api/report.json').then((r) => r.json()).then((d) => {
    const sum = (k) => d.teams.reduce((a, t) => a + t[k], 0)
    document.getElementById('rows').innerHTML = d.teams.map((t) =>
      `<tr><td>${t.team}</td><td class="n">${fmt(t.members)}</td><td class="n">${fmt(t.sessions)}</td><td class="n">${fmt(t.views)}</td>` +
      `<td class="n ${t.change < 0 ? 'down' : 'up'}">${t.change > 0 ? '+' : ''}${t.change}%</td></tr>`).join('')
    document.getElementById('foot').innerHTML = `<tr><td>Total</td><td class="n">${fmt(sum('members'))}</td><td class="n">${fmt(sum('sessions'))}</td><td class="n">${fmt(sum('views'))}</td><td></td></tr>`
    const max = Math.max(...d.days.map((x) => x.sessions))
    document.getElementById('chart').innerHTML = d.days.map((x) => `<div style="height:${(x.sessions / max) * 100}%"><span>${x.day}</span></div>`).join('')
    document.getElementById('recent').innerHTML = d.recent.map((r) => `<tr><td>${r.name}</td><td>${r.date}</td><td>${r.format}</td><td>${r.type}</td><td><a href="#">Download</a></td></tr>`).join('')
    document.body.dataset.ready = '1'
  })
</script>
</body>
</html>
